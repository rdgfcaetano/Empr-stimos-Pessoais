services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loans
      POSTGRES_PASSWORD: loans
      POSTGRES_DB: loans
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://loans:loans@postgres:5432/loans
      SECRET_KEY: change-me-in-production
      CORS_ORIGINS: http://localhost:5173,http://frontend:5173
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
